<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — Litchi Lover</title>
<meta name="description" content="Track your Litchi Lover order status in real time.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="track-order.html">
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_PAGE = 'track-order';
</script>
</head>
<body class="page-track-order">
<div id="site-header"></div>

<main>
  <div class="page-hero">
    <h1>Track Your Order</h1>
    <p>Enter your order number and phone number to see live status.</p>
  </div>

  <section class="section">
    <div class="container">
      <div style="max-width:520px;margin:0 auto">
        <form id="trackForm" class="checkout-form-card">
          <div class="form-field" style="margin-bottom:14px">
            <label>Order Number</label>
            <input type="text" name="order_number" placeholder="e.g. LL-2026-000001" required>
          </div>
          <div class="form-field" style="margin-bottom:18px">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="017XXXXXXXX" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Track My Order</button>
        </form>
      </div>

      <div style="max-width:640px;margin:48px auto 0" id="trackResults"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
