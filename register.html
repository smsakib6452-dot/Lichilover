<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Litchi Lover</title>
<meta name="description" content="Create a Litchi Lover account.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="register.html">
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_PAGE = 'register';
</script>
</head>
<body class="page-register">
<div id="site-header"></div>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Join Litchi Lover for faster checkout and order tracking.</p>

      <div id="registerGeneralError"></div>

      <form id="registerForm">
        <div class="form-field" style="margin-bottom:14px">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Your full name" required>
        </div>
        <div class="form-field" style="margin-bottom:14px">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-field" style="margin-bottom:14px">
          <label>Phone</label>
          <input type="tel" name="phone" placeholder="017XXXXXXXX" required>
        </div>
        <div class="form-field" style="margin-bottom:14px">
          <label>Password</label>
          <input type="password" name="password" placeholder="At least 8 characters" required>
        </div>
        <div class="form-field" style="margin-bottom:18px">
          <label>Confirm Password</label>
          <input type="password" name="password_confirm" placeholder="Repeat your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Create Account</button>
      </form>

      <p class="auth-foot">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
