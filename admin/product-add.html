<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product — Litchi Lover Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_ASSET_BASE = '../';
window.LL_ADMIN_PAGE = 'product-add';
window.LL_ADMIN_TITLE = 'Add Product';
</script>
</head>
<body>
<div id="admin-header"></div>

<form id="productForm">
    <div class="filter-bar">
        <a href="products.html" class="btn btn-ghost btn-sm">&larr; Back to Products</a>
        <div class="spacer"></div>
        <button type="submit" class="btn btn-primary">Create Product</button>
    </div>

    <div class="admin-card">
        <h3>Product Information</h3>
        <div class="form-grid">
            <div class="form-field full">
                <label>Product Name</label>
                <input type="text" name="name" placeholder="e.g. Premium Rajshahi Litchi" required>
                <span class="form-error" data-error-for="name" style="display:none"></span>
            </div>
            <div class="form-field">
                <label>Category</label>
                <select name="category_id" id="categorySelect" required>
                    <option value="">Select category</option>
                </select>
                <span class="form-error" data-error-for="category_id" style="display:none"></span>
            </div>
            <div class="form-field">
                <label>Short Description</label>
                <input type="text" name="short_description" maxlength="255" placeholder="Short tagline for cards">
            </div>
            <div class="form-field full">
                <label>Full Description (HTML allowed)</label>
                <textarea name="description" rows="6"></textarea>
            </div>
            <div class="form-field full">
                <label>Image URL</label>
                <input type="url" name="image" placeholder="https://images.pexels.com/photos/16820482/pexels-photo-16820482.jpeg?auto=compress&cs=tinysrgb&w=900">
                <span class="form-error" data-error-for="image" style="display:none"></span>
                <span class="form-hint">Leave empty to use a real litchi photo. Paste any Pexels or Unsplash image URL.</span>
            </div>
            <div class="form-field">
                <label>Compare Price (৳)</label>
                <input type="number" step="0.01" min="0" name="compare_price" placeholder="Original price for discount badge">
            </div>
            <div class="form-field">
                <label>&nbsp;</label>
                <div style="display:flex;gap:16px;padding-top:8px">
                    <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" name="is_featured" value="1"> Featured</label>
                    <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" name="is_active" value="1" checked> Active</label>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-card">
        <div class="card-head">
            <h3>Variants (sizes &amp; pricing)</h3>
            <button type="button" class="btn btn-ghost btn-sm" id="addVariantBtn"><i data-lucide="plus"></i> Add Variant</button>
        </div>
        <div class="alert alert-error" data-error-for="variants" style="display:none"></div>
        <div id="variantRows">
            <div class="variant-row" style="border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr 1fr 1fr auto;align-items:end;margin-bottom:10px">
                <div><label style="font-size:12px;font-weight:700">Name</label><input type="text" name="variant_names[]" placeholder="1 KG" required></div>
                <div><label style="font-size:12px;font-weight:700">Weight (kg)</label><input type="number" step="0.01" min="0" name="variant_weights[]"></div>
                <div><label style="font-size:12px;font-weight:700">Price (৳)</label><input type="number" step="0.01" min="0" name="variant_prices[]" required></div>
                <div><label style="font-size:12px;font-weight:700">Compare (৳)</label><input type="number" step="0.01" min="0" name="variant_compare[]"></div>
                <div><label style="font-size:12px;font-weight:700">Stock</label><input type="number" min="0" name="variant_stocks[]" value="0"></div>
                <div style="display:flex;gap:6px;align-items:center">
                    <label style="font-size:12px;font-weight:700"><input type="radio" name="variant_default" value="0" checked> Default</label>
                    <button type="button" class="btn btn-danger btn-sm remove-variant">×</button>
                </div>
            </div>
        </div>
    </div>

    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary btn-lg">Create Product</button>
        <a href="products.html" class="btn btn-ghost btn-lg">Cancel</a>
    </div>
</form>

<div id="admin-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin-components.js"></script>
<script src="../assets/js/admin-pages.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
