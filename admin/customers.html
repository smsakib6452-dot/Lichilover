<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — Lichi Lover Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_ASSET_BASE = '../';
window.LL_ADMIN_PAGE = 'customers';
window.LL_ADMIN_TITLE = 'Customers';
</script>
</head>
<body>
<div id="admin-header"></div>

<div class="filter-bar">
    <form id="customersFilterForm" style="display:flex;gap:8px;flex-wrap:wrap;flex:1">
        <input type="search" name="q" placeholder="Search name, email, phone..." style="min-width:240px">
        <button type="submit" class="btn btn-ghost btn-sm">Search</button>
    </form>
</div>

<div class="admin-card">
    <div class="table-wrap">
        <table class="data">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Orders</th>
                    <th>Total Spent</th>
                    <th>Joined</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="customersBody"></tbody>
        </table>
    </div>
    <div id="customersPagination"></div>
</div>

<div id="admin-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin-components.js"></script>
<script src="../assets/js/admin-pages.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
