<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Litchi Lover Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_ASSET_BASE = '../';
window.LL_ADMIN_PAGE = 'products';
window.LL_ADMIN_TITLE = 'Products';
</script>
</head>
<body>
<div id="admin-header"></div>

<div class="filter-bar">
    <form id="productsFilterForm" style="display:flex;gap:8px;flex-wrap:wrap;flex:1">
        <input type="search" name="q" placeholder="Search products..." style="min-width:200px">
        <select name="status">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="out">Out of stock</option>
        </select>
        <button type="submit" class="btn btn-ghost btn-sm">Filter</button>
    </form>
    <div class="spacer"></div>
    <a href="product-add.html" class="btn btn-primary"><i data-lucide="plus"></i> Add Product</a>
</div>

<div class="admin-card">
    <div class="table-wrap">
        <table class="data">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Featured</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productsBody"></tbody>
        </table>
    </div>
    <div id="productsPagination"></div>
</div>

<div id="admin-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin-components.js"></script>
<script src="../assets/js/admin-pages.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
