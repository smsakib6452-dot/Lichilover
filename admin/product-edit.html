<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product — Litchi Lover Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_ASSET_BASE = '../';
window.LL_ADMIN_PAGE = 'product-edit';
window.LL_ADMIN_TITLE = 'Edit Product';
</script>
</head>
<body>
<div id="admin-header"></div>

<div class="alert alert-error" id="productNotFound" style="display:none">
    <i data-lucide="alert-circle"></i>
    <span>Product not found. <a href="products.html">Back to Products</a></span>
</div>

<form id="productForm">
    <input type="hidden" name="action" value="update">

    <div class="filter-bar">
        <a href="products.html" class="btn btn-ghost btn-sm">&larr; Back to Products</a>
        <div class="spacer"></div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>

    <div class="admin-card">
        <h3>Product Information</h3>
        <div class="form-grid">
            <div class="form-field full">
                <label>Product Name</label>
                <input type="text" name="name" required>
                <span class="form-error" data-error-for="name" style="display:none"></span>
            </div>
            <div class="form-field">
                <label>Category</label>
                <select name="category_id" id="categorySelect">
                    <option value="">Select category</option>
                </select>
                <span class="form-error" data-error-for="category_id" style="display:none"></span>
            </div>
            <div class="form-field">
                <label>Short Description</label>
                <input type="text" name="short_description" maxlength="255">
            </div>
            <div class="form-field full">
                <label>Full Description (HTML allowed)</label>
                <textarea name="description" rows="6"></textarea>
            </div>
            <div class="form-field full">
                <label>Image URL</label>
                <input type="url" name="image" placeholder="https://images.pexels.com/photos/16820482/pexels-photo-16820482.jpeg?auto=compress&cs=tinysrgb&w=900">
                <span class="form-error" data-error-for="image" style="display:none"></span>
                <div style="margin-top:8px"><img id="imagePreview" alt="" style="display:none;width:90px;height:90px;border-radius:10px;object-fit:cover"></div>
            </div>
            <div class="form-field">
                <label>Compare Price (৳)</label>
                <input type="number" step="0.01" min="0" name="compare_price">
            </div>
            <div class="form-field">
                <label>&nbsp;</label>
                <div style="display:flex;gap:16px;padding-top:8px">
                    <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" name="is_featured" value="1"> Featured</label>
                    <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" name="is_active" value="1"> Active</label>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-card">
        <div class="card-head">
            <h3>Variants</h3>
            <button type="button" class="btn btn-ghost btn-sm" id="addVariantBtn"><i data-lucide="plus"></i> Add Variant</button>
        </div>
        <div class="alert alert-error" data-error-for="variants" style="display:none"></div>
        <div id="variantRows"></div>
    </div>

    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-primary btn-lg">Save Product</button>
        <a href="products.html" class="btn btn-ghost btn-lg">Cancel</a>
    </div>
</form>

<div class="admin-card" id="dangerZone" style="margin-top:24px;border-color:#ef9aa4">
    <h3 style="color:var(--litchi-600)">Danger Zone</h3>
    <form id="deleteProductForm">
        <input type="hidden" name="action" value="delete">
        <button type="submit" class="btn btn-danger">Delete Product</button>
    </form>
</div>

<div id="admin-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin-components.js"></script>
<script src="../assets/js/admin-pages.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
