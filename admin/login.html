<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Lichi Lover</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_ASSET_BASE = '../';
window.LL_ADMIN_PAGE = 'login';
</script>
</head>
<body class="admin-login-body">
    <div class="admin-login">
        <div class="admin-login-card">
            <div style="text-align:center;margin-bottom:20px">
                <img src="../assets/images/logo.svg" alt="Logo" width="64" height="64">
                <h1>Lichi Lover Admin</h1>
                <p>Sign in to manage your store.</p>
            </div>

            <div class="alert alert-error" id="loginGeneralError" style="display:none"></div>

            <div class="alert alert-info" style="margin-bottom:16px">
                <span>Demo admin (DEVELOPMENT ONLY): <strong>admin@lichilover.com</strong> / <strong>admin123</strong></span>
            </div>

            <form id="loginForm">
                <div class="form-field" style="margin-bottom:14px">
                    <label>Email</label>
                    <input type="email" name="email" id="loginEmail" required autofocus>
                    <span class="form-error" data-error-for="loginEmail" style="display:none"></span>
                </div>
                <div class="form-field" style="margin-bottom:18px">
                    <label>Password</label>
                    <input type="password" name="password" id="loginPassword" required>
                    <span class="form-error" data-error-for="loginPassword" style="display:none"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block">Login</button>
            </form>

            <p class="admin-login-back"><a href="../index.html">&larr; Back to website</a></p>
        </div>
    </div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin-components.js"></script>
<script src="../assets/js/admin-pages.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
