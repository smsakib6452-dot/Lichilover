<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Lichi Lover</title>
<meta name="description" content="Login to your Lichi Lover account.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="login.html">
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
window.LL_PAGE = 'login';
</script>
</head>
<body class="page-login">
<div id="site-header"></div>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Login to your Lichi Lover account.</p>

      <div id="loginGeneralError"></div>

      <form id="loginForm">
        <div class="form-field" style="margin-bottom:14px">
          <label>Email or Phone</label>
          <input type="text" name="login" placeholder="you@example.com or 017XXXXXXXX" required autofocus>
        </div>
        <div class="form-field" style="margin-bottom:18px">
          <label>Password</label>
          <input type="password" name="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Login</button>
      </form>

      <p class="auth-foot">
        Don't have an account? <a href="register.html">Register now</a>
      </p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
